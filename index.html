d:#fffaeb;border:1px solid #fedf89;color:#7a2e0e;font-size:13px}.exercise{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #e4e7ec}.exercise small{display:block;color:#667085}.timer{text-align:center;font-size:42px;font-weight:800;padding:10px}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#2563eb}.footer{text-align:center;color:#98a2b3;font-size:12px;margin:25px}

  if(el && !el.innerHTML.trim()){
    el.innerHTML='<div class="card"><h2>TriFuel had trouble loading</h2><p class="muted">Please refresh the page. If this continues, the app will show the error here.</p></div>';
  }
});
</script><style>

</style></head><body><div class="app">
<header class="hero"><h1>TriFuel</h1><p>Race fueling + mobility, built around your training.</p></header>
<nav class="nav" id="nav"></nav><main class="wrap">
<section id="home" class="page"></section><section id="race" class="page hidden"></section>
<section id="nutrition" class="page hidden"></section><section id="mobility" class="page hidden"></section>
<section id="settings" class="page hidden"></section><div class="footer">TriFuel v2.7 • Educational guidance only.</div>
</main></div>
<script>
const D={weight:157,swim:40,bike:90,run:60,temp:78,carb:70,sodium:600,fluid:22,breakfast:120,raceDate:"",
drink:"Gatorade Endurance",drinkCarb:54,drinkSodium:520,drinkOz:20,gel:"Gel",gelCarb:25,gelSodium:100};
let s=JSON.parse(localStorage.getItem("trifuel")||"null")||{...D};
function go(x){location.hash=x}function nav(){let a=location.hash.slice(1)||"home",m=[["home","⌂","Home"],["race","⏱","Race"],["nutrition","⚡","Nutrition"],["mobility","🧘","Mobility"],["settings","⚙","Settings"]];document.getElementById("nav").innerHTML=m.map(x=>`<button class="${a==x[0]?"active":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}
function calc(){return{bc:Math.round(s.carb*s.bike/60),bn:Math.round(s.sodium*s.bike/60),bf:Math.round(s.fluid*s.bike/60),rc:Math.round(s.carb*s.run/60),rn:Math.round(s.sodium*s.run/60)}}
function renderHome(){let c=calc(),d=s.raceDate?Math.max(0,Math.ceil((new Date(s.raceDate+"T12:00:00")-new Date())/86400000)):null;document.getElementById("home").innerHTML=`<div class="grid"><div class="card"><span class="pill">Athlete</span><div class="big">${s.weight} lb</div><div class="muted">Race fueling profile</div></div><div class="card"><span class="pill">Countdown</span><div class="big">${d===null?"—":d+" days"}</div><div class="muted">${s.raceDate||"Set race date in Settings"}</div></div></div><div class="section grid3"><div class="card"><b>Bike</b><div class="big">${c.bc} g</div><div class="muted">carbs • ${c.bn} mg sodium</div></div><div class="card"><b>Run</b><div class="big">${c.rc} g</div><div class="muted">carbs • ${c.rn} mg sodium</div></div><div class="card"><b>Fluid</b><div class="big">${s.fluid}</div><div class="muted">oz/hour</div></div></div><div class="section card"><h2>Quick start</h2><div class="row"><button type="button" class="btn" onclick="go('race')">Race-day plan</button><button type="button" class="btn secondary" onclick="startMob('bike','dynamic')">Bike warm-up</button><button type="button" class="btn secondary" onclick="go('mobility')">Mobility plans</button></div></div><div class="section card"><h2>Focus of v2</h2><p class="muted">Nutrition, hydration, sodium, race-day timing, and mobility. Training plans and workouts are intentionally excluded because you already use a separate training app.</p></div>`}
function renderRace(){let c=calc();document.getElementById("race").innerHTML=`<div class="card"><span class="pill">Olympic triathlon</span><h2>Race-day fueling timeline</h2>${[
["T−3:00","Breakfast",`~${s.breakfast} g carbs. Bagel + banana + honey/jam + electrolyte drink.`],
["T−0:20","Pre-swim","1 gel (~25 g carbs) + water."],["Swim",`${s.swim} min`,"No fueling required."],
["Bike 0:15","Start fueling","Begin drink + 1 gel."],["Bike 0:40","Fuel",`1 gel + drink. Target ~${s.carb} g carbs/hr and ~${s.sodium} mg sodium/hr.`],
["Bike 1:05","Fuel","1 gel + drink."],["T2","Run setup","Water/sports drink as needed; don't force fluids."],
["Run 0:15","Gel","~25 g carbs + water."],["Run 0:40","Gel","~25 g carbs + water/sports drink."]
].map(x=>`<div class="event"><div class="time">${x[0]}</div><div class="eventbox"><strong>${x[1]}</strong>${x[2]}</div></div>`).join("")}<div class="note"><b>Approximate totals:</b> bike ${c.bc} g carbs, ${c.bn} mg sodium, ~${c.bf} oz fluid; run ${c.rc} g carbs and ${c.rn} mg sodium.</div></div>`}
function renderNutrition(){
const carb=Number(s.carb)||75,sodium=Number(s.sodium)||600,fluid=Number(s.fluid)||24,breakfast=Number(s.breakfast)||100;
nutrition.innerHTML=`<div class="card"><h2>Race nutrition</h2><p class="muted">Your fueling targets at a glance.</p>
<div class="nutrition-hero">
<div class="nutrition-stat"><small>Carbohydrate</small><div class="big">${carb} g/hr</div><span>Bike + run target</span></div>
<div class="nutrition-stat"><small>Sodium</small><div class="big">${sodium} mg/hr</div><span>Adjust for conditions</span></div>
<div class="nutrition-stat"><small>Fluid</small><div class="big">${fluid} oz/hr</div><span>Drink consistently</span></div>
<div class="nutrition-stat"><small>Breakfast</small><div class="big">${breakfast} g</div><span>Pre-race carbs</span></div></div></div>
<div class="section grid">
<div class="nutrition-card"><h2>🏊 Swim</h2><div class="nutrition-row"><span>Before</span><b>Carbs + fluids</b></div><div class="nutrition-row"><span>During</span><b>Usually no fueling</b></div><div class="nutrition-row"><span>After</span><b>Start bike fueling early</b></div></div>
<div class="nutrition-card"><h2>🚴 Bike</h2><div class="nutrition-row"><span>Carbs</span><b>${carb} g/hr</b></div><div class="nutrition-row"><span>Sodium</span><b>${sodium} mg/hr</b></div><div class="nutrition-row"><span>Fluid</span><b>${fluid} oz/hr</b></div></div>
<div class="nutrition-card"><h2>🏃 Run</h2><div class="nutrition-row"><span>Carbs</span><b>${carb} g/hr</b></div><div class="nutrition-row"><span>Fluid</span><b>${fluid} oz/hr</b></div><div class="nutrition-row"><span>Focus</span><b>Small, frequent doses</b></div></div></div>
<div class="section nutrition-card"><h2>Race-day checklist</h2>
<div class="nutrition-row"><span>Breakfast</span><b>${breakfast} g carbs</b></div>
<div class="nutrition-row"><span>Bike</span><b>Carbs + sodium + fluid</b></div>
<div class="nutrition-row"><span>Run</span><b>Gel/drink every 20–30 min</b></div>
<div class="nutrition-row"><span>Transition</span><b>Fuel immediately on bike</b></div></div>`;
}
const plans={
swim:{
  name:"Swimming",
  focus:"Shoulders, thoracic spine, lats and hips",
  dynamic:[
    ["Warm-up","Arm circles","30 sec"],
    ["Warm-up","Band pull-aparts","12 reps"],
    ["Warm-up","Thoracic rotations","8/side"],
    ["Warm-up","Scapular push-ups","10 reps"],
    ["Warm-up","World's greatest stretch","5/side"],
    ["Warm-up","Hip circles","8/side"]
  ],
  stat:[
    ["Post-swim","Lat stretch","40 sec/side"],
    ["Post-swim","Cross-body shoulder stretch","40 sec/side"],
    ["Post-swim","Chest doorway stretch","40 sec/side"],
    ["Post-swim","Thoracic extension","40 sec"],
    ["Post-swim","Hip flexor stretch","40 sec/side"],
    ["Post-swim","Glute stretch","40 sec/side"]
  ]
},
bike:{
  name:"Cycling",
  focus:"Hip flexors, quads, glutes, hamstrings and thoracic posture",
  dynamic:[
    ["Warm-up","March + arm swing","60 sec"],
    ["Warm-up","Leg swings","10/side"],
    ["Warm-up","Hip circles","8/side"],
    ["Warm-up","Walking lunge + reach","8/side"],
    ["Warm-up","Glute bridge","12 reps"],
    ["Warm-up","Bodyweight squat","10 reps"]
  ],
  stat:[
    ["Post-ride","Hip flexor stretch","45 sec/side"],
    ["Post-ride","Quad stretch","45 sec/side"],
    ["Post-ride","Hamstring stretch","45 sec/side"],
    ["Post-ride","Glute stretch","45 sec/side"],
    ["Post-ride","Calf stretch","40 sec/side"],
    ["Post-ride","Chest/shoulder stretch","40 sec/side"]
  ]
},
run:{
  name:"Running",
  focus:"Calves, ankles, quads, hamstrings, hips and glutes",
  dynamic:[
    ["Warm-up","A-march","20 steps"],
    ["Warm-up","Leg swings","10/side"],
    ["Warm-up","Walking lunge","8/side"],
    ["Warm-up","Calf raises","12 reps"],
    ["Warm-up","Ankle circles","10/side"],
    ["Warm-up","Glute bridge","12 reps"]
  ],
  stat:[
    ["Post-run","Calf stretch","45 sec/side"],
    ["Post-run","Soleus stretch","45 sec/side"],
    ["Post-run","Quad stretch","45 sec/side"],
    ["Post-run","Hamstring stretch","45 sec/side"],
    ["Post-run","Hip flexor stretch","45 sec/side"],
    ["Post-run","Glute stretch","45 sec/side"]
  ]
}};
let ms={discipline:"bike",kind:"dynamic",i:0,sec:60,t:null};
const movementInfo={
"Arm circles":{muscles:"Shoulders • upper back",steps:"Stand tall. Make smooth circles with both arms, gradually increasing the range. Keep ribs relaxed and avoid shrugging.",tip:"Keep the movement controlled rather than forcing the end range."},
"Band pull-aparts":{muscles:"Rear shoulders • upper back",steps:"Hold a light resistance band at chest height. Pull the band apart while keeping shoulders down, then return slowly.",tip:"Use a light band and avoid arching your lower back."},
"Thoracic rotations":{muscles:"Mid-back • shoulders",steps:"Keep your hips steady and rotate your upper body gently from side to side. Move through a comfortable range.",tip:"Think rotation through the upper back, not a forced twist."},
"Scapular push-ups":{muscles:"Serratus • shoulder blade stabilizers",steps:"From a plank or wall position, keep elbows straight and gently move your shoulder blades apart and together.",tip:"Use a wall version if the floor version is too demanding."},
"World's greatest stretch":{muscles:"Hips • hamstrings • thoracic spine",steps:"Step into a lunge, place the opposite hand near the front foot, rotate the other arm toward the ceiling, then return smoothly.",tip:"Stay within a comfortable range and keep the front knee controlled."},
"Hip circles":{muscles:"Hips • glutes",steps:"Stand tall with a hand supported if needed. Draw small controlled circles with one hip, then reverse directions.",tip:"Start small and increase the circle only if it feels comfortable."},
"March + arm swing":{muscles:"Hip flexors • shoulders • core",steps:"March in place while swinging the opposite arm naturally. Maintain an upright posture and steady rhythm.",tip:"Use this to gradually raise temperature before harder movement."},
"Leg swings":{muscles:"Hip flexors • hamstrings • glutes",steps:"Hold a stable support. Swing one relaxed leg forward and backward in a controlled arc, then switch sides.",tip:"Do not force height; gradually increase range."},
"Walking lunge + reach":{muscles:"Quads • glutes • hip flexors",steps:"Step forward into a comfortable lunge while reaching overhead, then push through the front foot and continue.",tip:"Keep the front knee tracking in line with the foot."},
"Glute bridge":{muscles:"Glutes • hamstrings",steps:"Lie on your back with knees bent. Drive through your feet and lift your hips until your body forms a comfortable line, then lower.",tip:"Finish with the glutes rather than arching your low back."},
"Bodyweight squat":{muscles:"Quads • glutes • hips",steps:"Stand with feet comfortable. Sit the hips back and bend the knees, then stand tall with controlled tempo.",tip:"Keep knees tracking with the toes."},
"March + arm swing":{muscles:"Hip flexors • shoulders • core",steps:"March in place while swinging the opposite arm naturally. Maintain an upright posture and steady rhythm.",tip:"Use this to gradually raise temperature before harder movement."},
"A-march":{muscles:"Hip flexors • calves • core",steps:"March with tall posture, lifting one knee while the opposite arm drives forward. Alternate sides with control.",tip:"Stay tall and avoid leaning backward."},
"Calf raises":{muscles:"Calves • ankles",steps:"Stand tall and slowly rise onto the balls of your feet, pause briefly, then lower with control.",tip:"Use support for balance if needed."},
"Ankle circles":{muscles:"Ankle stabilizers • lower leg",steps:"Lift one foot and draw slow circles with the ankle in both directions. Switch sides.",tip:"Keep the circles controlled rather than large and forced."},
"Hip flexor stretch":{muscles:"Hip flexors • front of thigh",steps:"Use a half-kneeling position with the torso upright. Gently shift the pelvis forward until a mild stretch is felt in the front of the hip.",tip:"Do not arch the lower back."},
"Quad stretch":{muscles:"Quadriceps",steps:"Stand supported if needed. Bend one knee and bring the heel toward the glute while keeping the knees close.",tip:"Keep the pelvis neutral and avoid pulling aggressively."},
"Hamstring stretch":{muscles:"Hamstrings",steps:"Extend one leg comfortably and hinge forward from the hips until a gentle stretch is felt behind the thigh.",tip:"Keep the spine comfortable; don't chase your toes."},
"Glute stretch":{muscles:"Glutes • deep hip rotators",steps:"Use a seated or lying figure-four position. Gently draw the legs toward you until a mild stretch is felt.",tip:"Keep the sensation mild and breathe normally."},
"Calf stretch":{muscles:"Gastrocnemius • Achilles region",steps:"Place the hands on a wall, step one leg back, keep the heel down and gently lean forward.",tip:"Keep the rear foot pointed mostly forward."},
"Soleus stretch":{muscles:"Soleus • lower calf",steps:"Use a wall-supported staggered stance with the back knee slightly bent. Gently shift forward while keeping the heel down.",tip:"A bent back knee changes the emphasis lower in the calf."},
"Chest/shoulder stretch":{muscles:"Chest • front shoulder",steps:"Place your forearm or hand against a doorway and gently turn your body away until a mild stretch is felt.",tip:"Don't crank the shoulder backward."},
"Cross-body shoulder stretch":{muscles:"Rear shoulder",steps:"Bring one arm across the chest and use the other arm to gently draw it closer.",tip:"Keep the shoulder relaxed rather than shrugging."},
"Chest doorway stretch":{muscles:"Chest • shoulders",steps:"Place your forearms on a doorway and gently step forward until you feel a comfortable chest stretch.",tip:"Keep the ribs down and avoid forcing the range."},
"Thoracic extension":{muscles:"Thoracic spine • chest",steps:"Use a supported position to gently extend the upper back over a comfortable surface or with hands behind the head.",tip:"Move through the upper back rather than the low back."},
"Lat stretch":{muscles:"Lats • side body • shoulders",steps:"Reach both arms overhead and gently shift the torso to one side, then switch.",tip:"Keep the movement comfortable and breathe into the side body."},
"Scapular push-ups":{muscles:"Serratus • shoulder blade stabilizers",steps:"From a plank or wall position, keep elbows straight and gently move your shoulder blades apart and together.",tip:"Use a wall version if the floor version is too demanding."}
};

function startMob(d,k){
  ms={discipline:d,kind:k,i:0,sec:k=="dynamic"?60:45,t:null};
  renderMobTimer();
}
function renderMob(){
  const d=ms.discipline, plan=plans[d];
  mobility.innerHTML=`<div class="card"><h2>Stretching & mobility</h2><p class="muted">Choose the discipline, then choose a dynamic warm-up or static recovery plan.</p>
  <div class="row">${Object.entries(plans).map(([key,v])=>`<button class="btn ${key==d?"":"secondary"}" onclick="selectDiscipline('${key}')">${v.name}</button>`).join("")}</div>
  <div class="section note"><b>${plan.name} focus:</b> ${plan.focus}</div>
<div class="section card"><h2>${plan.name} routine</h2><p class="muted">Simple checklist for before and after training.</p>
<div class="exercise"><span><b>Dynamic — before</b><small>${plan.dynamic.map(x=>x[1]).join(" • ")}</small></span></div>
<div class="exercise"><span><b>Static — after</b><small>${plan.stat.map(x=>x[1]).join(" • ")}</small></span></div></div>
  <div class="section grid"><div class="card"><span class="pill">Before training</span><h2>Dynamic</h2><p class="muted">Movement-based preparation.</p><button type="button" class="btn" onclick="startMob('${d}','dynamic')">Start dynamic</button></div>
  <div class="card"><span class="pill">After training</span><h2>Static</h2><p class="muted">Relaxed post-training holds.</p><button type="button" class="btn" onclick="startMob('${d}','static')">Start static</button></div></div>
  <div class="section"><div class="metric"><b>Swim</b><span>Shoulders • thoracic • lats • hips</span></div><div class="metric"><b>Bike</b><span>Hips • quads • glutes • posture</span></div><div class="metric"><b>Run</b><span>Calves • ankles • legs • hips</span></div></div>
  </div>
</div><div class="note">Stop any movement that causes sharp, electric, radiating, or worsening pain.</div>`;
}
function selectDiscipline(d){ms.discipline=d;renderMob()}
function videoUrl(name){
  return "https://www.youtube.com/results?search_query="+encodeURIComponent(name+" exercise demonstration");
}
function exampleButton(name){
  return `<button type="button" class="btn secondary" onclick="openMovement('${name.replace(/'/g,"\\'")}')">View example</button>`;
}
function openMovement(name){
  const info=movementInfo[name]||{muscles:"Mobility",steps:"Move slowly through a comfortable range of motion.",tip:"Stop if the movement causes pain."};
  const modal=document.createElement("div");
  modal.className="movement-modal";
  modal.innerHTML=`<div class="movement-sheet">
    <div class="movement-visual">🧘</div>
    <h2>${name}</h2>
    <span class="pill">${info.muscles}</span>
    <h3>How to do it</h3><p>${info.steps}</p>
    <div class="note"><b>Form tip:</b> ${info.tip}</div>
    <div class="row" style="margin-top:14px">
      <a class="btn" href="${videoUrl(name)}" target="_blank" rel="noopener">▶ Watch video</a>
      <button type="button" class="btn secondary" onclick="this.closest('.movement-modal').remove()">Close</button>
    </div>
  </div>`;
  modal.addEventListener("click",e=>{if(e.target===modal)modal.remove()});
  document.body.appendChild(modal);
}
function renderMobTimer(){
  const a=plans[ms.discipline][ms.kind];
  mobility.innerHTML=`<div class="card"><span class="pill">${plans[ms.discipline].name} • ${ms.kind=="dynamic"?"Dynamic":"Static"}</span><h2>${a[ms.i][1]}</h2>
  <div class="timer" id="mt">${fmt(ms.sec)}</div><p class="muted">${a[ms.i][0]} • ${a[ms.i][2]}</p>
  <div class="row"><button type="button" class="btn" onclick="timerStart()">Start</button><button type="button" class="btn secondary" onclick="nextMob()">Next</button><button type="button" class="btn secondary" onclick="go('mobility')">Exit</button></div>
  <div class="progress"><div style="width:${ms.i/a.length*100}%"></div></div>
  ${a.map((x,i)=>`<div class="exercise"><span>${i+1}. ${x[1]}<small>${x[0]} • ${x[2]}</small></span><span class="row">${exampleButton(x[1])}${i==ms.i?"<b>▶</b>":""}</span></div>`).join("")}</div>`;
}
function timerStart(){if(ms.t)return;ms.t=setInterval(()=>{ms.sec--;let e=document.getElementById("mt");if(e)e.textContent=fmt(ms.sec);if(ms.sec<=0)nextMob()},1000)}
function nextMob(){
  if(ms.t){clearInterval(ms.t);ms.t=null}
  const a=plans[ms.discipline][ms.kind];
  if(ms.i>=a.length-1){alert("Routine complete!");go("mobility");return}
  ms.i++;ms.sec=ms.kind=="dynamic"?60:45;renderMobTimer();
}

function renderSettings(){document.getElementById("settings").innerHTML=`<div class="card"><h2>Race profile</h2><div class="grid">${[["weight","Weight (lb)"],["swim","Swim (min)"],["bike","Bike (min)"],["run","Run (min)"],["temp","Expected temp (°F)"],["carb","Carbs (g/hr)"],["sodium","Sodium (mg/hr)"],["fluid","Fluid (oz/hr)"],["breakfast","Breakfast carbs (g)"]].map(x=>`<div class="field"><label>${x[1]}</label><input id="${x[0]}" type="number" inputmode="decimal" value="${s[x[0]]}"></div>`).join("")}
<div class="field"><label>Race date</label><div class="date-row"><input id="raceDate" type="date" value="${s.raceDate||""}" autocomplete="off"><button type="button" class="btn secondary" onclick="pickRaceDate()">📅 Choose date</button></div></div></div><button type="button" class="btn" onclick="saveSettings()">Save profile</button></div><div class="section card"><h2>Product labels</h2>${[["drink","Drink name","text"],["drinkOz","Drink serving (oz)","number"],["drinkCarb","Drink carbs (g)","number"],["drinkSodium","Drink sodium (mg)","number"],["gel","Gel name","text"],["gelCarb","Gel carbs (g)","number"],["gelSodium","Gel sodium (mg)","number"]].map(x=>`<div class="field"><label>${x[1]}</label><input id="${x[0]}" type="${x[2]}" value="${s[x[0]]}"></div>`).join("")}<button type="button" class="btn" onclick="saveProducts()">Save products</button></div><div class="section card"><button type="button" class="btn danger" onclick="resetApp()">Reset app data</button></div>`}
function pickRaceDate(){
  const el=document.getElementById("raceDate");
  if(!el)return;
  try{ if(typeof el.showPicker==="function"){el.showPicker();return;} }catch(e){}
  el.focus();
}
function saveSettings(){["weight","swim","bike","run","temp","carb","sodium","fluid","breakfast"].forEach(k=>s[k]=Number(document.getElementById(k).value));s.raceDate=document.getElementById("raceDate").value;save();go("home")}
function saveProducts(){["drink","drinkOz","drinkCarb","drinkSodium","gel","gelCarb","gelSodium"].forEach(k=>{let v=document.getElementById(k).value;s[k]=["drinkOz","drinkCarb","drinkSodium","gelCarb","gelSodium"].includes(k)?Number(v):v});save();go("nutrition")}
function resetApp(){if(confirm("Reset TriFuel?")){localStorage.removeItem("trifuel");s={...D};renderAll()}}
function render(id){document.querySelectorAll(".page").forEach(e=>e.classList.toggle("hidden",e.id!==id));nav();const fn={home:renderHome,race:renderRace,nutrition:renderNutrition,mobility:renderMob,settings:renderSettings}[id]||renderHome;fn()}
function renderAll(){const id=location.hash.slice(1)||"home";render(["home","race","nutrition","mobility","settings"].includes(id)?id:"home")}addEventListener("hashchange",renderAll);renderAll();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
