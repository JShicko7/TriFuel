<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest">
<title>TriFuel — Triathlon Coach</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--accent2:#0ea5e9;--good:#16a34a;--warn:#d97706;--nav:#0b1220;--soft:#eef4ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding-bottom:90px}.top{background:linear-gradient(135deg,#0b1220,#182b52);color:#fff;padding:28px 20px 34px;border-radius:0 0 28px 28px}.top h1{margin:0;font-size:28px}.top p{margin:7px 0 0;color:#cbd5e1}.wrap{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(16,24,40,.04)}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.big{font-size:30px;font-weight:800}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--soft);color:#1d4ed8;font-size:12px;font-weight:700}.metric{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.section{margin-top:18px}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--accent);color:white}.btn.secondary{background:#eef2f7;color:#344054}.btn.danger{background:#fee4e2;color:#b42318}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px;background:#fff}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,18,32,.97);display:flex;justify-content:center;z-index:10}.nav button{background:none;border:0;color:#98a2b3;padding:12px 10px;min-width:90px;font-size:12px}.nav button.active{color:#fff}.nav span{display:block;font-size:18px;margin-bottom:2px}.timeline{position:relative;margin-left:8px}.event{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:0 0 18px}.time{font-weight:800;color:#1d4ed8}.eventbox{border-left:3px solid #bfdbfe;padding-left:14px}.eventbox strong{display:block}.check{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.check input{width:18px;height:18px}.hidden{display:none}.note{background:#fffaeb;border:1px solid #fedf89;padding:12px;border-radius:12px;color:#7a2e0e;font-size:13px}.success{background:#ecfdf3;border-color:#abefc6;color:#05603a}.tag{font-size:12px;color:#475467}.footer{text-align:center;color:#98a2b3;font-size:12px;margin:28px 0}@media(min-width:760px){.nav{position:sticky;top:0;bottom:auto;margin:0 auto 18px;border-radius:0 0 16px 16px}.nav button{padding:14px 24px}.app{padding-bottom:20px}.top{border-radius:0 0 28px 28px}.wrap{padding:24px}}
</style></head>
<body>
<div class="app">
<header class="top"><h1>TriFuel</h1><p>Your personalized Olympic triathlon training & race-day coach.</p></header>
<nav class="nav" id="nav"></nav>
<main class="wrap">
<section id="dashboard" class="page"></section>
<section id="race" class="page hidden"></section>
<section id="training" class="page hidden"></section>
<section id="fuel" class="page hidden"></section>
<section id="settings" class="page hidden"></section>
<div class="footer">TriFuel v1 • Fueling guidance is a planning tool, not medical advice.</div>
</main></div>
<script>
const DEFAULT={weight:157,swim:40,bike:90,run:60,temp:78,sweat:'moderate',raceDate:'',carb:70,sodium:600,fluid:22,breakfast:120,products:{drink:'Gatorade Endurance',drinkOz:20,drinkCarb:54,drinkSodium:520,gel:'Generic gel',gelCarb:25,gelSodium:100}};
let s=JSON.parse(localStorage.getItem('trifuel')||'null')||DEFAULT;
const save=()=>{localStorage.setItem('trifuel',JSON.stringify(s));renderAll()};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function calc(){let bikeH=s.bike/60,runH=s.run/60;return{bikeCarb:Math.round(s.carb*bikeH),runCarb:Math.round(s.carb*runH),bikeNa:Math.round(s.sodium*bikeH),runNa:Math.round(s.sodium*runH),bikeFluid:Math.round(s.fluid*bikeH),runFluid:Math.round(s.fluid*runH)}}
function nav(){let items=[['dashboard','⌂','Dashboard'],['race','⏱','Race Plan'],['training','🏋','Training'],['fuel','⚡','Fuel'],['settings','⚙','Settings']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${location.hash.slice(1)==x[0]||(location.hash===''&&x[0]=='dashboard')?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function go(id){location.hash=id;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!==id));nav();render(id)}
function renderDashboard(){let c=calc(), date=s.raceDate?new Date(s.raceDate+'T12:00:00'):null;let days=date?Math.ceil((date-new Date())/86400000):null;document.getElementById('dashboard').innerHTML=`<div class="grid"><div class="card"><span class="pill">Race profile</span><div class="big">157 lb</div><div class="muted">${s.swim}m swim • ${s.bike}m bike • ${s.run}m run</div></div><div class="card"><span class="pill">Race countdown</span><div class="big">${days==null?'—':Math.max(0,days)+' days'}</div><div class="muted">${s.raceDate?esc(s.raceDate):'Set race date in Settings'}</div></div></div><div class="section grid3"><div class="card"><h3>Bike fuel</h3><div class="big">${c.bikeCarb} g</div><div class="muted">carbs • ${c.bikeNa} mg sodium</div></div><div class="card"><h3>Run fuel</h3><div class="big">${c.runCarb} g</div><div class="muted">carbs • ${c.runNa} mg sodium</div></div><div class="card"><h3>Hydration</h3><div class="big">${s.fluid} oz/hr</div><div class="muted">starting target</div></div></div><div class="section card"><h2>Today's focus</h2><div class="check"><input type="checkbox"> Practice race fueling on a long bike</div><div class="check"><input type="checkbox"> Complete mobility / strength session</div><div class="check"><input type="checkbox"> Log how your stomach and energy felt</div><div class="row" style="margin-top:14px"><button class="btn" onclick="go('race')">Open race plan</button><button class="btn secondary" onclick="go('fuel')">Adjust fuel</button></div></div>`}
function renderRace(){let c=calc();document.getElementById('race').innerHTML=`<div class="card"><span class="pill">Olympic distance</span><h2 style="margin-top:10px">Race-day timeline</h2><p class="muted">${s.swim} min swim • ${s.bike} min bike • ${s.run} min run</p><div class="timeline"><div class="event"><div class="time">T−3:00</div><div class="eventbox"><strong>Breakfast</strong><span>~${s.breakfast} g carbs. Bagel + banana + honey/jam + electrolyte drink.</span></div></div><div class="event"><div class="time">T−0:20</div><div class="eventbox"><strong>Pre-swim</strong><span>1 gel (~25 g carbs) + water.</span></div></div><div class="event"><div class="time">Swim</div><div class="eventbox"><strong>35–45 min</strong><span>No fueling required.</span></div></div><div class="event"><div class="time">Bike 0:15</div><div class="eventbox"><strong>Start fueling</strong><span>Begin drink + 1 gel. Don't wait for hunger.</span></div></div><div class="event"><div class="time">Bike 0:40</div><div class="eventbox"><strong>Fuel</strong><span>1 gel + drink. Aim for ~${s.carb} g carbs/hr and ~${s.sodium} mg sodium/hr.</span></div></div><div class="event"><div class="time">Bike 1:05</div><div class="eventbox"><strong>Fuel</strong><span>1 gel + drink. Finish the bike well fueled.</span></div></div><div class="event"><div class="time">T2</div><div class="eventbox"><strong>Run setup</strong><span>Take water/sports drink as needed; don't overdrink.</span></div></div><div class="event"><div class="time">Run 0:15</div><div class="eventbox"><strong>Gel</strong><span>~25 g carbs + water.</span></div></div><div class="event"><div class="time">Run 0:40</div><div class="eventbox"><strong>Gel</strong><span>~25 g carbs + water/sports drink.</span></div></div></div><div class="note success"><b>Your current targets:</b> ${c.bikeCarb} g carbs + ${c.bikeNa} mg sodium + ~${c.bikeFluid} oz fluid on the bike; ${c.runCarb} g carbs + ${c.runNa} mg sodium on the run. Adjust based on sweat testing and race conditions.</div></div>`}
function renderTraining(){document.getElementById('training').innerHTML=`<div class="grid"><div class="card"><span class="pill">Swim</span><h2>Technique + endurance</h2><p>Warm-up 10 min • drills 10 min • 4×8 min steady with 2 min easy • cooldown 5 min.</p><span class="tag">Keep it aerobic; practice sighting and race-start rhythm.</span></div><div class="card"><span class="pill">Bike</span><h2>Race-fuel rehearsal</h2><p>75–100 min easy/moderate. Practice ${s.carb} g carbs/hr, ${s.sodium} mg sodium/hr, and your planned bottles/gels.</p><span class="tag">This is your key nutrition practice session.</span></div><div class="card"><span class="pill">Run</span><h2>Return-to-run progression</h2><p>Only use if cleared and currently pain-free enough for running. Start short and easy; stop if symptoms worsen.</p><span class="tag">Your app should prioritize a conservative progression rather than a race-day surprise.</span></div><div class="card"><span class="pill">Strength</span><h2>Core + hips</h2><p>2–3 rounds: goblet squat, Romanian deadlift, split squat, cable row, Pallof press, side plank. Keep loads controlled.</p><span class="tag">Progress gradually and keep technique clean.</span></div></div><div class="section card"><h2>Weekly template</h2><div class="metric"><b>Mon</b><span>Easy / recovery</span></div><div class="metric"><b>Tue</b><span>Bike intervals + short strength</span></div><div class="metric"><b>Wed</b><span>Swim endurance</span></div><div class="metric"><b>Thu</b><span>Easy bike + mobility</span></div><div class="metric"><b>Fri</b><span>Strength workout</span></div><div class="metric"><b>Sat</b><span>Long bike + fueling rehearsal</span></div><div class="metric"><b>Sun</b><span>Swim / recovery / run progression if appropriate</span></div></div>`}
function renderFuel(){let c=calc();document.getElementById('fuel').innerHTML=`<div class="grid"><div class="card"><h2>Race targets</h2><div class="metric"><span>Carbohydrate</span><b>${s.carb} g/hr</b></div><div class="metric"><span>Sodium</span><b>${s.sodium} mg/hr</b></div><div class="metric"><span>Fluid</span><b>${s.fluid} oz/hr</b></div><div class="metric"><span>Bike total carbs</span><b>${c.bikeCarb} g</b></div><div class="metric"><span>Run total carbs</span><b>${c.runCarb} g</b></div></div><div class="card"><h2>Product math</h2><p class="muted">Based on your entered drink and gel labels.</p><div class="metric"><span>1 drink serving</span><b>${s.products.drinkCarb} g / ${s.products.drinkSodium} mg</b></div><div class="metric"><span>1 gel</span><b>${s.products.gelCarb} g / ${s.products.gelSodium} mg</b></div><div class="metric"><span>Bike: 3 gels + 1 drink</span><b>${3*s.products.gelCarb+s.products.drinkCarb} g / ${3*s.products.gelSodium+s.products.drinkSodium} mg</b></div></div></div><div class="section card"><h2>Simple race pack</h2><div class="check"><input type="checkbox"> 1 bottle electrolyte/sports drink</div><div class="check"><input type="checkbox"> 3 bike gels</div><div class="check"><input type="checkbox"> 2 run gels</div><div class="check"><input type="checkbox"> Backup gel</div><div class="check"><input type="checkbox"> Water access at run aid stations</div><p class="note">The product calculation is only as accurate as the nutrition labels you enter. Don't treat a generic sodium target as a substitute for sweat-rate testing.</p></div>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="card"><h2>Athlete profile</h2><div class="grid"><div class="field"><label>Weight (lb)</label><input id="weight" type="number" value="${s.weight}"></div><div class="field"><label>Race date</label><input id="raceDate" type="date" value="${s.raceDate}"></div><div class="field"><label>Swim (min)</label><input id="swim" type="number" value="${s.swim}"></div><div class="field"><label>Bike (min)</label><input id="bike" type="number" value="${s.bike}"></div><div class="field"><label>Run (min)</label><input id="run" type="number" value="${s.run}"></div><div class="field"><label>Expected temp (°F)</label><input id="temp" type="number" value="${s.temp}"></div><div class="field"><label>Carbs (g/hr)</label><input id="carb" type="number" value="${s.carb}"></div><div class="field"><label>Sodium (mg/hr)</label><input id="sodium" type="number" value="${s.sodium}"></div><div class="field"><label>Fluid (oz/hr)</label><input id="fluid" type="number" value="${s.fluid}"></div><div class="field"><label>Breakfast carbs (g)</label><input id="breakfast" type="number" value="${s.breakfast}"></div></div><button class="btn" onclick="saveSettings()">Save profile</button> <button class="btn danger" onclick="resetApp()">Reset</button></div><div class="section card"><h2>Product labels</h2><div class="field"><label>Drink name</label><input id="drink" value="${esc(s.products.drink)}"></div><div class="grid"><div class="field"><label>Drink serving (oz)</label><input id="drinkOz" type="number" value="${s.products.drinkOz}"></div><div class="field"><label>Drink carbs (g)</label><input id="drinkCarb" type="number" value="${s.products.drinkCarb}"></div><div class="field"><label>Drink sodium (mg)</label><input id="drinkSodium" type="number" value="${s.products.drinkSodium}"></div><div class="field"><label>Gel name</label><input id="gel" value="${esc(s.products.gel)}"></div><div class="field"><label>Gel carbs (g)</label><input id="gelCarb" type="number" value="${s.products.gelCarb}"></div><div class="field"><label>Gel sodium (mg)</label><input id="gelSodium" type="number" value="${s.products.gelSodium}"></div></div><button class="btn" onclick="saveProducts()">Save products</button></div>`}
function saveSettings(){['weight','swim','bike','run','temp','carb','sodium','fluid','breakfast'].forEach(k=>s[k]=Number(document.getElementById(k).value));s.raceDate=document.getElementById('raceDate').value;save();go('dashboard')}
function saveProducts(){s.products={drink:document.getElementById('drink').value,drinkOz:Number(document.getElementById('drinkOz').value),drinkCarb:Number(document.getElementById('drinkCarb').value),drinkSodium:Number(document.getElementById('drinkSodium').value),gel:document.getElementById('gel').value,gelCarb:Number(document.getElementById('gelCarb').value),gelSodium:Number(document.getElementById('gelSodium').value)};save();go('fuel')}
function resetApp(){if(confirm('Reset all TriFuel settings?')){localStorage.removeItem('trifuel');s=JSON.parse(JSON.stringify(DEFAULT));renderAll()}}
function render(id){({dashboard:renderDashboard,race:renderRace,training:renderTraining,fuel:renderFuel,settings:renderSettings}[id])()}
function renderAll(){let id=location.hash.slice(1)||'dashboard';go(id)}
window.addEventListener('hashchange',renderAll);renderAll();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
