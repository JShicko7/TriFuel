<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest">
<title>TriFuel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#101828}.app{max-width:900px;margin:auto;padding-bottom:80px}.hero{background:linear-gradient(135deg,#0b1220,#1e3a6d);color:white;padding:26px 20px 30px;border-radius:0 0 26px 26px}.hero h1{margin:0;font-size:30px}.hero p{color:#cbd5e1;margin:6px 0 0}.wrap{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #e4e7ec;border-radius:18px;padding:18px;box-shadow:0 3px 15px #1018280b}.card h2{margin:0 0 10px}.muted{color:#667085}.big{font-size:29px;font-weight:800}.pill{display:inline-block;background:#eef4ff;color:#1d4ed8;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e4e7ec}.metric:last-child{border:0}.section{margin-top:16px}.btn{border:0;border-radius:11px;padding:11px 14px;background:#2563eb;color:white;font-weight:700}.btn.secondary{background:#eef2f7;color:#344054}.btn.danger{background:#fee4e2;color:#b42318}.row{display:flex;gap:9px;flex-wrap:wrap}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1220;display:flex;justify-content:center;z-index:5;overflow:auto}.nav button{background:none;border:0;color:#98a2b3;padding:10px 8px;min-width:74px;font-size:11px}.nav button.active{color:white}.nav span{display:block;font-size:18px}.hidden{display:none}.event{display:grid;grid-template-columns:86px 1fr;gap:12px;padding-bottom:17px}.time{font-weight:800;color:#1d4ed8}.eventbox{border-left:3px solid #bfdbfe;padding-left:13px}.eventbox strong{display:block}.note{padding:12px;border-radius:12px;background:#fffaeb;border:1px solid #fedf89;color:#7a2e0e;font-size:13px}.exercise{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #e4e7ec}.exercise small{display:block;color:#667085}.timer{text-align:center;font-size:42px;font-weight:800;padding:10px}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#2563eb}.footer{text-align:center;color:#98a2b3;font-size:12px;margin:25px}
@media(min-width:700px){.nav{position:sticky;top:0;bottom:auto;margin-bottom:15px;border-radius:0 0 15px 15px}.app{padding-bottom:15px}}
</style></head><body><div class="app">
<header class="hero"><h1>TriFuel</h1><p>Race fueling + mobility, built around your training.</p></header>
<nav class="nav" id="nav"></nav><main class="wrap">
<section id="home" class="page"></section><section id="race" class="page hidden"></section>
<section id="nutrition" class="page hidden"></section><section id="mobility" class="page hidden"></section>
<section id="settings" class="page hidden"></section><div class="footer">TriFuel v2 • Educational guidance only.</div>
</main></div>
<script>
const D={weight:157,swim:40,bike:90,run:60,temp:78,carb:70,sodium:600,fluid:22,breakfast:120,raceDate:"",
drink:"Gatorade Endurance",drinkCarb:54,drinkSodium:520,drinkOz:20,gel:"Gel",gelCarb:25,gelSodium:100};
let s=JSON.parse(localStorage.getItem("trifuel")||"null")||{...D};
function go(x){location.hash=x}function nav(){let a=location.hash.slice(1)||"home",m=[["home","⌂","Home"],["race","⏱","Race"],["nutrition","⚡","Nutrition"],["mobility","🧘","Mobility"],["settings","⚙","Settings"]];document.getElementById("nav").innerHTML=m.map(x=>`<button class="${a==x[0]?"active":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}
function calc(){return{bc:Math.round(s.carb*s.bike/60),bn:Math.round(s.sodium*s.bike/60),bf:Math.round(s.fluid*s.bike/60),rc:Math.round(s.carb*s.run/60),rn:Math.round(s.sodium*s.run/60)}}
function renderHome(){let c=calc(),d=s.raceDate?Math.max(0,Math.ceil((new Date(s.raceDate+"T12:00:00")-new Date())/86400000)):null;document.getElementById("home").innerHTML=`<div class="grid"><div class="card"><span class="pill">Athlete</span><div class="big">${s.weight} lb</div><div class="muted">Race fueling profile</div></div><div class="card"><span class="pill">Countdown</span><div class="big">${d===null?"—":d+" days"}</div><div class="muted">${s.raceDate||"Set race date in Settings"}</div></div></div><div class="section grid3"><div class="card"><b>Bike</b><div class="big">${c.bc} g</div><div class="muted">carbs • ${c.bn} mg sodium</div></div><div class="card"><b>Run</b><div class="big">${c.rc} g</div><div class="muted">carbs • ${c.rn} mg sodium</div></div><div class="card"><b>Fluid</b><div class="big">${s.fluid}</div><div class="muted">oz/hour</div></div></div><div class="section card"><h2>Quick start</h2><div class="row"><button class="btn" onclick="go('race')">Race-day plan</button><button class="btn secondary" onclick="startMob('dynamic')">Dynamic warm-up</button><button class="btn secondary" onclick="startMob('static')">Static recovery</button></div></div><div class="section card"><h2>Focus of v2</h2><p class="muted">Nutrition, hydration, sodium, race-day timing, and mobility. Training plans and workouts are intentionally excluded because you already use a separate training app.</p></div>`}
function renderRace(){let c=calc();document.getElementById("race").innerHTML=`<div class="card"><span class="pill">Olympic triathlon</span><h2>Race-day fueling timeline</h2>${[
["T−3:00","Breakfast",`~${s.breakfast} g carbs. Bagel + banana + honey/jam + electrolyte drink.`],
["T−0:20","Pre-swim","1 gel (~25 g carbs) + water."],["Swim",`${s.swim} min`,"No fueling required."],
["Bike 0:15","Start fueling","Begin drink + 1 gel."],["Bike 0:40","Fuel",`1 gel + drink. Target ~${s.carb} g carbs/hr and ~${s.sodium} mg sodium/hr.`],
["Bike 1:05","Fuel","1 gel + drink."],["T2","Run setup","Water/sports drink as needed; don't force fluids."],
["Run 0:15","Gel","~25 g carbs + water."],["Run 0:40","Gel","~25 g carbs + water/sports drink."]
].map(x=>`<div class="event"><div class="time">${x[0]}</div><div class="eventbox"><strong>${x[1]}</strong>${x[2]}</div></div>`).join("")}<div class="note"><b>Approximate totals:</b> bike ${c.bc} g carbs, ${c.bn} mg sodium, ~${c.bf} oz fluid; run ${c.rc} g carbs and ${c.rn} mg sodium.</div></div>`}
function renderNutrition(){let c=calc();document.getElementById("nutrition").innerHTML=`<div class="grid"><div class="card"><h2>Your targets</h2>${[["Carbs",s.carb+" g/hr"],["Sodium",s.sodium+" mg/hr"],["Fluid",s.fluid+" oz/hr"],["Bike total",c.bc+" g carbs"],["Run total",c.rc+" g carbs"]].map(x=>`<div class="metric"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div><div class="card"><h2>Product labels</h2><div class="metric"><span>${s.drink}</span><b>${s.drinkCarb} g / ${s.drinkSodium} mg</b></div><div class="metric"><span>${s.gel}</span><b>${s.gelCarb} g / ${s.gelSodium} mg</b></div><div class="metric"><span>3 gels + 1 drink</span><b>${3*s.gelCarb+s.drinkCarb} g / ${3*s.gelSodium+s.drinkSodium} mg</b></div></div></div><div class="section card"><h2>Race packing</h2>${["Sports/electrolyte drink","3 bike gels","2 run gels","1 backup gel"].map(x=>`<div class="exercise"><span>${x}</span><input type="checkbox"></div>`).join("")}<p class="note">Enter exact label values in Settings. Sodium needs vary with sweat rate and conditions.</p></div>`}
const dyn=[["General","March + arm swing","60 sec"],["General","Leg swings","10/side"],["General","Walking lunge + reach","8/side"],["Swim","Arm circles","10 each way"],["Swim","Thoracic rotations","8/side"],["Bike","Glute bridge","10 reps"],["Bike","Hip circles","8/side"],["Run","A-march","20 steps"],["Run","Calf raises","12 reps"]];
const stat=[["Recovery","Hip flexor stretch","40 sec/side"],["Recovery","Quad stretch","40 sec/side"],["Recovery","Hamstring stretch","40 sec/side"],["Recovery","Calf stretch","40 sec/side"],["Recovery","Glute stretch","40 sec/side"],["Recovery","Adductor stretch","40 sec/side"],["Recovery","Chest/shoulder stretch","40 sec/side"],["Recovery","Lat stretch","40 sec/side"]];
let ms={kind:"dynamic",i:0,sec:60,t:null};
function startMob(k){ms={kind:k,i:0,sec:k=="dynamic"?60:40,t:null};renderMobTimer()}
function renderMob(){document.getElementById("mobility").innerHTML=`<div class="grid"><div class="card"><span class="pill">Before training</span><h2>Dynamic stretching</h2><p class="muted">Movement-based warm-up before your training app's workout.</p><button class="btn" onclick="startMob('dynamic')">Start</button></div><div class="card"><span class="pill">After training</span><h2>Static stretching</h2><p class="muted">Relaxed holds after training or on recovery days.</p><button class="btn" onclick="startMob('static')">Start</button></div></div><div class="section card"><h2>By discipline</h2><div class="metric"><b>Swim</b><span>Shoulders + thoracic</span></div><div class="metric"><b>Bike</b><span>Hips + glutes</span></div><div class="metric"><b>Run</b><span>Legs + calves</span></div></div><div class="note">Stop any movement that causes sharp, electric, radiating, or worsening pain.</div>`}
function fmt(x){return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function renderMobTimer(){let a=ms.kind=="dynamic"?dyn:stat;document.getElementById("mobility").innerHTML=`<div class="card"><span class="pill">${ms.kind=="dynamic"?"Dynamic warm-up":"Static recovery"}</span><h2>${a[ms.i][1]}</h2><div class="timer" id="mt">${fmt(ms.sec)}</div><p class="muted">${a[ms.i][0]} • ${a[ms.i][2]}</p><div class="row"><button class="btn" onclick="timerStart()">Start</button><button class="btn secondary" onclick="nextMob()">Next</button><button class="btn secondary" onclick="go('mobility')">Exit</button></div><div class="progress"><div style="width:${ms.i/a.length*100}%"></div></div>${a.map((x,i)=>`<div class="exercise"><span>${i+1}. ${x[1]}<small>${x[0]} • ${x[2]}</small></span><b>${i==ms.i?"▶":""}</b></div>`).join("")}</div>`}
function timerStart(){if(ms.t)return;ms.t=setInterval(()=>{ms.sec--;let e=document.getElementById("mt");if(e)e.textContent=fmt(ms.sec);if(ms.sec<=0)nextMob()},1000)}
function nextMob(){if(ms.t){clearInterval(ms.t);ms.t=null}let a=ms.kind=="dynamic"?dyn:stat;if(ms.i>=a.length-1){alert("Routine complete!");go("mobility");return}ms.i++;ms.sec=ms.kind=="dynamic"?60:40;renderMobTimer()}
function renderSettings(){document.getElementById("settings").innerHTML=`<div class="card"><h2>Race profile</h2><div class="grid">${[["weight","Weight (lb)"],["raceDate","Race date"],["swim","Swim (min)"],["bike","Bike (min)"],["run","Run (min)"],["temp","Expected temp (°F)"],["carb","Carbs (g/hr)"],["sodium","Sodium (mg/hr)"],["fluid","Fluid (oz/hr)"],["breakfast","Breakfast carbs (g)"]].map(x=>`<div class="field"><label>${x[1]}</label><input id="${x[0]}" type="${x[0]=="raceDate"?"date":"number"} value="${s[x[0]]}"></div>`).join("")}</div><button class="btn" onclick="saveSettings()">Save profile</button></div><div class="section card"><h2>Product labels</h2>${[["drink","Drink name","text"],["drinkOz","Drink serving (oz)","number"],["drinkCarb","Drink carbs (g)","number"],["drinkSodium","Drink sodium (mg)","number"],["gel","Gel name","text"],["gelCarb","Gel carbs (g)","number"],["gelSodium","Gel sodium (mg)","number"]].map(x=>`<div class="field"><label>${x[1]}</label><input id="${x[0]}" type="${x[2]}" value="${s[x[0]]}"></div>`).join("")}<button class="btn" onclick="saveProducts()">Save products</button></div><div class="section card"><button class="btn danger" onclick="resetApp()">Reset app data</button></div>`}
function saveSettings(){["weight","swim","bike","run","temp","carb","sodium","fluid","breakfast"].forEach(k=>s[k]=Number(document.getElementById(k).value));s.raceDate=document.getElementById("raceDate").value;save();go("home")}
function saveProducts(){["drink","drinkOz","drinkCarb","drinkSodium","gel","gelCarb","gelSodium"].forEach(k=>{let v=document.getElementById(k).value;s[k]=["drinkOz","drinkCarb","drinkSodium","gelCarb","gelSodium"].includes(k)?Number(v):v});save();go("nutrition")}
function resetApp(){if(confirm("Reset TriFuel?")){localStorage.removeItem("trifuel");s={...D};renderAll()}}
function render(id){document.querySelectorAll(".page").forEach(e=>e.classList.toggle("hidden",e.id!==id));nav();const fn={home:renderHome,race:renderRace,nutrition:renderNutrition,mobility:renderMobility,settings:renderSettings}[id]||renderHome;fn()}
function renderAll(){render(location.hash.slice(1)||"home")}addEventListener("hashchange",renderAll);renderAll();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
